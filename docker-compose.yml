services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_manager_backend
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/app/frontend
      - ./backend:/app/backend
      - ./main.py:/app/main.py
      - ./uploads:/uploads
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/docs').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
